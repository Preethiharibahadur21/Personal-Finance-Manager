<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <title>Finance Manager</title>
</head>
<body style="background: url('bgd.jpg') no-repeat center center/cover; min-height: 100vh;">

  <!-- Navbar -->
  <nav class="navbar navbar-dark navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="bgf.jpg" width="30" height="30" class="d-inline-block align-top" alt="logo">
        <b>Personal Finance Manager</b>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="index.html" onclick="localStorage.clear();">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Dashboard Content -->
  <div class="container mt-5 text-white">
    <h2 class="text-center mb-4">Dashboard</h2>

    <!-- Summary -->
    <div class="row mb-4 text-center">
      <div class="col-md-4">
        <div class="p-3 bg-success rounded">
          <h5>Total Income</h5>
          <h3 id="totalIncome">₹0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-3 bg-danger rounded">
          <h5>Total Expense</h5>
          <h3 id="totalExpense">₹0</h3>
        </div>
      </div>
      <div class="col-md-4">
        <div class="p-3 bg-primary rounded">
          <h5>Balance</h5>
          <h3 id="balance">₹0</h3>
        </div>
      </div>
    </div>

    <!-- Entry Form -->
    <div class="card bg-dark text-white mb-4">
      <div class="card-header">Add Entry</div>
      <div class="card-body">
        <form id="entryForm">
          <div class="row mb-3">
            <div class="col-md-3">
              <input type="number" class="form-control" id="amount" placeholder="Amount (₹)" required>
            </div>
            <div class="col-md-3">
              <select class="form-select" id="type" required>
                <option value="income">Income</option>
                <option value="expense">Expense</option>
              </select>
            </div>
            <div class="col-md-3">
              <input type="text" class="form-control" id="category" placeholder="Category" required>
            </div>
            <div class="col-md-3">
              <input type="text" class="form-control" id="description" placeholder="Description (optional)">
            </div>
          </div>
          <button type="submit" class="btn btn-success">Add Entry</button>
        </form>
      </div>
    </div>

    <!-- Transaction List -->
    <div class="card bg-light text-dark mb-5">
      <div class="card-header">Transaction History</div>
      <ul id="entryList" class="list-group list-group-flush">
        <!-- Entries go here -->
      </ul>
    </div>
  </div>

  <!-- Script -->
  <script>
    let entries = [];

    if (localStorage.getItem("entries")) {
      entries = JSON.parse(localStorage.getItem("entries"));
      updateUI();
    }

    document.getElementById("entryForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const amount = parseFloat(document.getElementById("amount").value);
      const type = document.getElementById("type").value;
      const category = document.getElementById("category").value;
      const description = document.getElementById("description").value;

      const entry = {
        amount,
        type,
        category,
        description,
        date: new Date().toLocaleString()
      };

      entries.push(entry);
      localStorage.setItem("entries", JSON.stringify(entries));
      updateUI();
      this.reset();
    });

    function updateUI() {
      const income = entries.filter(e => e.type === "income").reduce((sum, e) => sum + e.amount, 0);
      const expense = entries.filter(e => e.type === "expense").reduce((sum, e) => sum + e.amount, 0);
      const balance = income - expense;

      document.getElementById("totalIncome").textContent = `₹${income}`;
      document.getElementById("totalExpense").textContent = `₹${expense}`;
      document.getElementById("balance").textContent = `₹${balance}`;

      const entryList = document.getElementById("entryList");
      entryList.innerHTML = "";

      entries.slice().reverse().forEach((e, index) => {
        const li = document.createElement("li");
        li.className = `list-group-item d-flex justify-content-between align-items-start 
          ${e.type === 'income' ? 'list-group-item-success' : 'list-group-item-danger'}`;
        li.innerHTML = `
          <div>
            <strong>${e.category}</strong> - ₹${e.amount}
            <br><small>${e.description || ""} | ${e.date}</small>
          </div>
          <button class="btn btn-sm btn-outline-dark" onclick="deleteEntry(${entries.length - 1 - index})">Delete</button>
        `;
        entryList.appendChild(li);
      });
    }

    function deleteEntry(index) {
      entries.splice(index, 1);
      localStorage.setItem("entries", JSON.stringify(entries));
      updateUI();
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
