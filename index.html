<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Finance-Manager</title>
</head>
 <body style="background: url('bgd.jpg') no-repeat center center/cover; height: 100vh; ">
    <!--Heading-->
    <header>
        <nav class="navbar navbar-dark  navbar-expand-lg" >
              <div class="container">
                   <a class="navbar-brand" href="#" ><img src="bgf.jpg" width="30" height="30" class="d-inline-block align-top" alt="logo">
                <b>Personal Finance Manager</b></a>
                  
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

              <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto" >
                    <li class="nav-item "><a class="nav-link active" href="#">Login</a></li>
                    <li class="nav-item"><a class="nav-link"href="#">Entry</a></li>
                    <li class="nav-item"><a class="nav-link"href="#">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link"href="#">Logout</a></li>
                </ul>
              </div>
            </div>
        </nav>
    </header>
    <!---contact form-->
    <div class="container d-flex justify-content-center align-items-center text-white ">
        <div class="col-6 py-5 ">
        <div class="row">
            <div class="col">
                <h1>Login</h1>
                <form  id="loginForm" action="">
                    <div class="form-group">
                        <label for="">Email</label>                  <!--email-->
                        <input type="email" class="form-control"name="email" id="email" required/>
                    </div>
                    <div class="form-group">
                     <label for="">Username</label>                  <!--username-->
                     <input type="text" class="form-control" name="username" id="username" required/>
                    </div>
                    <div class="form-group">
                     <label for="">Password</label>        <!--password-->
                     <input type="password" class="form-control" name="password" id="password"required/> 
                    </div>
                    <button type="Submit"class="btn btn-primary mt-2">Submit</button>

                </form>
            </div>
        </div>
    </div>
    </div>
    <!-- Script to redirect on login -->
    <script>
      document.getElementById("loginForm").addEventListener("submit", function(e) {
        e.preventDefault();
    
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
    
        if (username && password) {
          // Save username to localStorage
          localStorage.setItem("username", username);
    
          // Redirect to entry page
          window.location.href = "entry1.html";
        } else {
          alert("Please enter both username and password.");
        }
      });
    </script>
 


    
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  
</body>
</html>
