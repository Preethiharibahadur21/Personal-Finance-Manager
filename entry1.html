<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <title>Finance-Manager</title>
</head>
<body style="background: url('bgd.jpg') no-repeat center center/cover; height: 100vh; ">
  <header>
  <!-- Navbar -->
  <nav class="navbar navbar-dark  navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand" href="#">
        <img src="bgf.jpg" width="30" height="30" class="d-inline-block align-top" alt="logo"><b>Personal Finance Manager</b>
        
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Entry</a></li>
          <li class="nav-item"><a class="nav-link " href="#">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-danger" href="index.html">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>
   </header>
   <!-- Welcome Section -->
<div id="welcomeSection" class="d-flex justify-content-center align-items-center" style="height: 100vh;">
  <div class="bg-white text-dark p-5 rounded shadow text-center">
    <h1 id="welcomeMessage">Welcome!</h1>
    <p>You've successfully logged in.</p>
    <button onclick="update()" type="button" class="btn btn-success mt-3">OK</button>
  </div>
</div>
<!-- Script Block -->
<script>
  // Get username from localStorage
  const username = localStorage.getItem("username");
  if (username) {
    document.getElementById("welcomeMessage").textContent = `Welcome, ${username}!`;
  }
  function update(){
    window.location.href="dashboard.html"
  }
</script>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
